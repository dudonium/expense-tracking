<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — Учёт расходов</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-body">
    <main class="auth-card">
        <img src="/img/minion-pic.png" alt="Персонаж" onerror="this.style.display='none'">
        <div class="auth-form-side">
            <h1 class="auth-title">Добро пожаловать, друг!</h1>
            <div id="auth-error" class="alert alert-error hidden"></div>
            <form id="register-form">
                <div class="form-group">
                    <label for="username">Логин</label>
                    <input type="text" id="username" placeholder="Придумайте логин" required minlength="3" maxlength="50">
                </div>
                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" placeholder="Придумайте пароль" required minlength="4">
                </div>
                <button type="submit" class="btn-primary auth-btn">Создать аккаунт</button>
            </form>
            <p class="auth-switch">Уже были здесь? <a href="/login.html">Войти</a></p>
        </div>
    </main>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
